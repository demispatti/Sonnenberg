<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Sonnenberg application icon</title>
  <desc id="description">A low amber sun behind the Säntis mountain ridge and its summit tower.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#245f70"/>
      <stop offset="1" stop-color="#123441"/>
    </linearGradient>
    <linearGradient id="sun" x1="0.18" y1="0.08" x2="0.78" y2="0.9">
      <stop offset="0" stop-color="#ffd978"/>
      <stop offset="1" stop-color="#efa13d"/>
    </linearGradient>
    <filter id="sun-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#071a22" flood-opacity=".28"/>
    </filter>
    <clipPath id="card">
      <rect x="44" y="44" width="936" height="936" rx="218"/>
    </clipPath>
  </defs>

  <g filter="url(#card-shadow)">
    <rect x="44" y="44" width="936" height="936" rx="218" fill="url(#sky)"/>
    <rect x="56" y="56" width="912" height="912" rx="206" fill="none" stroke="#d7e8e6" stroke-opacity=".74" stroke-width="12"/>
  </g>

  <g clip-path="url(#card)">
    <circle cx="358" cy="438" r="226" fill="#f5b64f" opacity=".26" filter="url(#sun-glow)"/>
    <circle cx="358" cy="438" r="190" fill="url(#sun)"/>

    <path d="M-8 764C88 711 150 698 222 707c70 9 131-16 192-62 57-43 105-58 157-42 65 21 112 15 177-25 78-48 174-13 292 73v373H-8Z"
          fill="#35616b" opacity=".82"/>

    <path d="M42 868V788l101-66 76-20 60-60 52 18 58-77 48 14 65-101 45 22 72-139 39 16 38-48 38 51 42 41 38 91 48 24 54 83 54 29 116 96v106Z"
          fill="#edf2ed"/>

    <path d="M257 660l69-75 49 16 62-102 43 22 66-129 40 16 43-55 38 50-24 10-21 39-29-11-35 92-43-13-47 99-47-20-57 80Z"
          fill="#c6d9d5"/>

    <path d="M-6 850c120-72 221-71 319-21 88 45 176 47 272 0 123-60 256-47 445 56v149H-6Z"
          fill="#0b2834"/>

    <g fill="#edf2ed">
      <rect x="642" y="267" width="18" height="118" rx="9"/>
      <rect x="619" y="286" width="64" height="13" rx="6.5"/>
      <rect x="626" y="317" width="50" height="12" rx="6"/>
      <circle cx="651" cy="258" r="13"/>
    </g>
  </g>
</svg>
